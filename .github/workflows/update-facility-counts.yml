name: Update facility counts

on:
  schedule:
    # UTC 18:00 = JST 03:00
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run facility count update batch
        working-directory: backend
        run: npm run update:facility-counts

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/facility-counts.json
          git diff --cached --quiet || git commit -m "施設集計データを自動更新 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
